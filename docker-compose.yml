# ──────────────────────────────────────────────────────────
# Time Travel – Docker Compose
# Spins up the full application stack with one command:
#   docker compose up --build
# ──────────────────────────────────────────────────────────

services:
  redis:
    image: redis:7-alpine
    container_name: timetravel-redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: timetravel-web
    ports:
      - "5001:5001"
    env_file:
      - .env
    environment:
      - FLASK_ENV=${FLASK_ENV:-development}
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - db-data:/app/instance
      - ./data:/app/data:ro
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:5001/api/health')",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  db-data:
    driver: local
  redis-data:
    driver: local
