# ──────────────────────────────────────────────────────────
# CI/CD Pipeline – Time Travel
# Runs on every push & pull request to main
# ──────────────────────────────────────────────────────────

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # ── Unit Tests with Coverage ──────────────────────────
  test:
    name: Unit Tests + Coverage
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run linter (flake8)
        run: |
          flake8 app/ --max-line-length=120 --count --statistics --exclude=__pycache__

      - name: Run unit tests with coverage
        env:
          FLASK_ENV: testing
          SECRET_KEY: ci-test-secret-key-not-for-production
        run: |
          python -m pytest tests/ \
            --ignore=tests/test_integration.py \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml:coverage-unit.xml \
            --cov-fail-under=50 \
            --tb=short -q

      - name: Upload unit test coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-unit-py${{ matrix.python-version }}
          path: coverage-unit.xml

  # ── Integration Tests ─────────────────────────────────
  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run integration tests with coverage
        env:
          FLASK_ENV: testing
          SECRET_KEY: ci-test-secret-key-not-for-production
        run: |
          python -m pytest tests/test_integration.py \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml:coverage-integration.xml \
            --tb=short -v

      - name: Upload integration coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-integration
          path: coverage-integration.xml

  # ── Code Formatting ──────────────────────────────────
  lint:
    name: Code Formatting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install tools
        run: pip install black flake8

      - name: Check formatting (black)
        run: black --check --diff app/ tests/

  # ── Docker Build & Smoke Test ─────────────────────────
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [test, integration]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t timetravel:ci .

      - name: Verify container starts
        run: |
          docker run -d --name tt-test \
            -e FLASK_ENV=testing \
            -e SECRET_KEY=ci-docker-test \
            -p 5001:5001 \
            timetravel:ci
          sleep 5
          curl -f http://localhost:5001/api/health || exit 1
          docker stop tt-test
