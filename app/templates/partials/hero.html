<!-- ═══════════════════════════════════════════════ HERO ═════ -->
<section id="hero" class="hero">
  <!-- Rotating background images -->
  <div class="hero-bg" id="heroBg">
    <div
      class="hero-bg-slide active"
      style="
        background-image: url(&quot;https://images.unsplash.com/photo-1524492412937-b28074a5d7da?w=1600&q=80&quot;);
      "
    ></div>
    <div
      class="hero-bg-slide"
      style="
        background-image: url(&quot;https://images.unsplash.com/photo-1602216056096-3b40cc0c9944?w=1600&q=80&quot;);
      "
    ></div>
    <div
      class="hero-bg-slide"
      style="
        background-image: url(&quot;https://images.unsplash.com/photo-1477587458883-47145ed94245?w=1600&q=80&quot;);
      "
    ></div>
    <div
      class="hero-bg-slide"
      style="
        background-image: url(&quot;https://images.unsplash.com/photo-1506461883276-594a12b11cf3?w=1600&q=80&quot;);
      "
    ></div>
  </div>
  <div class="hero-overlay"></div>

  <div class="hero-center" id="heroContent">
    <h1 class="hero-title" id="heroTitle">
      Time To Travel <span class="hero-title-accent" id="heroPlace">India</span>
    </h1>
    <p class="hero-sub">
      Discover your next destination with intelligent search and calm guidance.
    </p>

    <div class="hero-search" id="heroSearch">
      <div class="hero-search-inner">
        <i class="fas fa-search hero-search-icon"></i>
        <input
          type="text"
          id="heroSearchInput"
          class="hero-search-input"
          placeholder="Where do you want to go?"
          autocomplete="off"
        />
        <kbd class="hero-search-kbd"><span>⌘</span>K</kbd>
        <button class="hero-search-btn" id="heroSearchBtn" aria-label="Search destinations">
          Search <i class="fas fa-arrow-right"></i>
        </button>
      </div>
    </div>

    <div class="hero-actions">
      <a href="#planningDashboard" class="hero-secondary-cta" id="heroPlanCta">
        Start Planning <i class="fas fa-route"></i>
      </a>
    </div>
  </div>
</section>
