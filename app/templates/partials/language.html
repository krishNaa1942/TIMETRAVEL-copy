    <section id="language" class="section-light" data-reveal>
      <div class="container">
        <h2 class="section-title">
          <i class="fas fa-language"></i> Local Language Helper
        </h2>
        <p class="section-desc">
          Essential phrases in the local language — bargain, navigate & connect
          like a local
        </p>
        <div class="tool-layout">
          <div class="tool-form" style="max-width: 350px">
            <div class="form-group">
              <label for="langDest"
                ><i class="fas fa-map-marker-alt"></i> Destination</label
              >
              <select id="langDest" data-dest-dropdown>
                <option value="">Select a destination</option>
              </select>
            </div>
            <button id="langSearchBtn" class="btn btn-primary btn-full">
              <i class="fas fa-book-open"></i> Get Phrases
            </button>
          </div>
          <div class="tool-result" id="langResult">
            <div class="result-placeholder">
              <i class="fas fa-language"></i>
              <p>
                Choose a destination to learn essential local language phrases
                for your trip
              </p>
            </div>
          </div>
        </div>
      </div>
    </section>
