    <section id="itinerary" class="section-dark" data-reveal>
      <div class="container">
        <h2 class="section-title light">
          <i class="fas fa-route"></i> AI Itinerary Generator
        </h2>
        <p class="section-desc light">
          Gemini AI creates a personalized day-by-day activity plan for your
          trip
        </p>
        <div class="tool-layout">
          <div class="tool-form">
            <div class="form-group">
              <label for="itinDest"
                ><i class="fas fa-map-marker-alt"></i> Destination</label
              >
              <select id="itinDest" data-dest-dropdown>
                <option value="">Select a destination</option>
              </select>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label for="itinDays"
                  ><i class="fas fa-calendar-alt"></i> Days</label
                >
                <input type="number" id="itinDays" min="1" max="14" value="3" />
              </div>
              <div class="form-group">
                <label for="itinFamily"
                  ><i class="fas fa-users"></i> Family Size</label
                >
                <input
                  type="number"
                  id="itinFamily"
                  min="1"
                  max="20"
                  value="4"
                />
              </div>
            </div>
            <div class="form-group">
              <label for="itinClass"
                ><i class="fas fa-star"></i> Travel Class</label
              >
              <select id="itinClass">
                <option value="economy">Economy</option>
                <option value="comfort">Comfort</option>
                <option value="premium">Premium</option>
              </select>
            </div>
            <div class="form-group">
              <label for="itinInterests"
                ><i class="fas fa-heart"></i> Interests
                <span style="font-weight: 400; color: var(--text-muted)"
                  >(optional)</span
                ></label
              >
              <input
                type="text"
                id="itinInterests"
                placeholder="e.g. beaches, street food, temples, adventure"
              />
            </div>
            <button id="itinSubmit" class="btn btn-primary btn-full">
              <i class="fas fa-magic"></i> Generate Itinerary
            </button>
          </div>
          <div class="tool-result" id="itinResult">
            <div class="result-placeholder">
              <i class="fas fa-route"></i>
              <p>
                Fill the form and click Generate to get a personalised
                day-by-day travel plan powered by Gemini AI
              </p>
            </div>
          </div>
        </div>
      </div>
    </section>
