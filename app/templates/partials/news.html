<section id="news" class="section-dark">
  <div class="container">
    <h2 class="section-title light">
      <i class="fas fa-newspaper"></i> Travel News & Updates
    </h2>
    <p class="section-desc light">
      Stay informed with the latest travel news, safety advisories, and trending
      stories
    </p>

    <!-- News Controls -->
    <div class="news-controls">
      <div class="news-controls-row">
        <div class="form-group">
          <label for="newsDest">Destination</label>
          <select id="newsDest" class="form-control">
            <option value="">All India</option>
          </select>
        </div>
        <div class="form-group">
          <label for="newsCat">Category</label>
          <select id="newsCat" class="form-control">
            <option value="travel">Travel</option>
            <option value="safety">Safety & Advisories</option>
            <option value="food">Food & Cuisine</option>
            <option value="culture">Culture & Heritage</option>
            <option value="adventure">Adventure</option>
          </select>
        </div>
        <div class="form-group" style="align-self: end">
          <button id="newsSearchBtn" class="btn btn-primary">
            <i class="fas fa-search"></i> Get News
          </button>
        </div>
      </div>

      <!-- Tab bar for news types -->
      <div class="news-tabs">
        <button class="news-tab active" data-tab="latest">
          <i class="fas fa-clock"></i> Latest
        </button>
        <button class="news-tab" data-tab="trending">
          <i class="fas fa-fire"></i> Trending
        </button>
        <button class="news-tab" data-tab="safety">
          <i class="fas fa-shield-alt"></i> Safety Alerts
        </button>
      </div>
    </div>

    <!-- News Grid -->
    <div class="empty-state" id="newsEmpty">
      <i class="fas fa-newspaper"></i>
      <p>
        Click <strong>Get News</strong> to fetch the latest travel stories and
        safety advisories.
      </p>
    </div>
    <div id="newsResults" class="news-grid" style="display: none"></div>
  </div>
</section>
