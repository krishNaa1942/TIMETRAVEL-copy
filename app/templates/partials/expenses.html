<!-- ═══════════════════════════════ EXPENSE TRACKER ═══ -->
<section id="expenses" class="section-dark" data-reveal>
  <div class="container">
    <h2 class="section-title light">
      <i class="fas fa-receipt"></i> Expense Tracker
    </h2>
    <p class="section-desc light">
      Log your spending in real-time and stay within budget
    </p>
    <div class="expense-layout">
      <div class="expense-form-card">
        <h3><i class="fas fa-plus-circle"></i> Add Expense</h3>
        <div class="form-group">
          <label for="expDest"
            ><i class="fas fa-map-marker-alt"></i> Destination</label
          >
          <select id="expDest" data-dest-dropdown>
            <option value="">Select destination</option>
          </select>
        </div>
        <div class="form-group">
          <label for="expCategory"><i class="fas fa-tag"></i> Category</label>
          <select id="expCategory">
            <option value="food">🍽️ Food & Dining</option>
            <option value="transport">🚗 Transport</option>
            <option value="accommodation">🏨 Accommodation</option>
            <option value="activity">🎭 Activities & Sightseeing</option>
            <option value="shopping">🛒 Shopping</option>
            <option value="misc">📦 Miscellaneous</option>
          </select>
        </div>
        <div class="form-group">
          <label for="expDesc"><i class="fas fa-pen"></i> Description</label>
          <input
            type="text"
            id="expDesc"
            placeholder="e.g. Auto to Calangute Beach"
          />
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="expAmount"
              ><i class="fas fa-rupee-sign"></i> Amount (₹)</label
            >
            <input type="number" id="expAmount" min="1" placeholder="500" />
          </div>
          <div class="form-group">
            <label for="expDate"><i class="fas fa-calendar"></i> Date</label>
            <input type="date" id="expDate" />
          </div>
        </div>
        <button id="expAddBtn" class="btn btn-primary btn-full">
          <i class="fas fa-plus"></i> Add Expense
        </button>
      </div>
      <div class="expense-summary-card">
        <div class="expense-total-bar">
          <span class="expense-total-label">Total Spent</span>
          <span class="expense-total-amount" id="expTotal">₹0</span>
        </div>
        <div id="expCategoryBars" class="expense-category-bars"></div>
        <div id="expList" class="expense-list">
          <div class="empty-state">
            <i class="fas fa-receipt"></i>
            <p>No expenses logged yet. Add your first expense!</p>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
