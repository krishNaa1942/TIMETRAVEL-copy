    <section id="maps" class="section-dark">
      <div class="container">
        <h2 class="section-title">
          <i class="fas fa-map-marked-alt"></i> Interactive Map
        </h2>
        <p class="section-desc">
          Explore destinations, find nearby attractions, and plan routes
        </p>

        <!-- Map Controls -->
        <div class="map-controls">
          <div class="map-controls-row">
            <div class="map-control-group">
              <label><i class="fas fa-map-pin"></i> Destination</label>
              <select id="mapDest">
                <option value="">Loading destinations…</option>
              </select>
            </div>
            <div class="map-control-group">
              <label><i class="fas fa-binoculars"></i> Explore Nearby</label>
              <select id="mapCategory">
                <option value="tourist attraction">Tourist Attractions</option>
                <option value="restaurant">Restaurants</option>
                <option value="hotel">Hotels</option>
                <option value="temple">Temples</option>
                <option value="hospital">Hospitals</option>
                <option value="beach">Beaches</option>
                <option value="museum">Museums</option>
                <option value="shopping">Shopping</option>
                <option value="atm">ATMs</option>
              </select>
            </div>
            <button class="btn btn-primary" id="mapExploreBtn">
              <i class="fas fa-search-location"></i> Explore
            </button>
          </div>

          <!-- Route Planner -->
          <div class="map-controls-row map-route-row">
            <div class="map-control-group">
              <label><i class="fas fa-plane-departure"></i> From</label>
              <select id="routeFrom">
                <option value="">Loading…</option>
              </select>
            </div>
            <div class="map-control-group">
              <label><i class="fas fa-plane-arrival"></i> To</label>
              <select id="routeTo">
                <option value="">Loading…</option>
              </select>
            </div>
            <div class="map-control-group">
              <label><i class="fas fa-car"></i> Mode</label>
              <select id="routeMode">
                <option value="car">Car</option>
                <option value="truck">Truck</option>
                <option value="motorcycle">Motorcycle</option>
                <option value="bicycle">Bicycle</option>
                <option value="pedestrian">Walk</option>
              </select>
            </div>
            <button class="btn btn-outline btn-route" id="mapRouteBtn">
              <i class="fas fa-route"></i> Get Route
            </button>
          </div>
        </div>

        <!-- Map Container -->
        <div class="map-wrapper">
          <div id="tomtomMap" class="map-canvas"></div>
          <!-- Live Location Button -->
          <button
            id="liveLocBtn"
            class="live-loc-btn"
            title="Track my live location"
          >
            <i class="fas fa-crosshairs"></i>
          </button>
          <!-- Location Status Badge -->
          <div id="locStatus" class="loc-status" style="display: none">
            <span class="loc-pulse"></span>
            <span id="locText">Locating…</span>
          </div>
          <!-- Route Info Overlay -->
          <div id="routeInfo" class="route-info" style="display: none">
            <div class="route-stat">
              <i class="fas fa-road"></i>
              <span id="routeDistance">—</span>
            </div>
            <div class="route-stat">
              <i class="fas fa-clock"></i>
              <span id="routeDuration">—</span>
            </div>
            <div class="route-stat">
              <i class="fas fa-traffic-light"></i>
              <span id="routeTraffic">—</span>
            </div>
          </div>
        </div>

        <!-- Smart Suggestions Panel -->
        <div
          id="suggestionsPanel"
          class="suggestions-panel"
          style="display: none"
        >
          <div class="suggestions-header">
            <div class="suggestions-title">
              <i class="fas fa-magic"></i>
              <div>
                <h3>Smart Suggestions</h3>
                <p id="suggestAddr">Based on your current location</p>
              </div>
            </div>
            <div
              id="nearestDestBadge"
              class="nearest-dest-badge"
              style="display: none"
            >
              <i class="fas fa-map-marker-alt"></i>
              <span id="nearestDestText">—</span>
            </div>
          </div>
          <div id="suggestionsContent" class="suggestions-content">
            <div class="suggestions-loading">
              <i class="fas fa-spinner fa-spin"></i> Finding places near you…
            </div>
          </div>
        </div>

        <!-- POI Results -->
        <div id="poiResults" class="poi-grid" style="display: none"></div>
      </div>
    </section>
