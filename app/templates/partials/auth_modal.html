<!-- ═══════════════════════════════════════════ AUTH MODAL ═══ -->
<div
  class="modal-overlay"
  id="authModal"
  style="display: none"
  data-action="close-auth-modal-overlay"
>
  <div class="modal-card" data-stop-propagation>
    <button class="modal-close" data-action="close-auth-modal">
      <i class="fas fa-times"></i>
    </button>

    <!-- Login Form -->
    <div id="loginForm" class="auth-form">
      <h2><i class="fas fa-plane"></i> Welcome Back</h2>
      <p class="auth-subtitle">Log in to access your trip history</p>
      <div class="form-group">
        <label for="loginEmail"><i class="fas fa-envelope"></i> Email</label>
        <input
          type="email"
          id="loginEmail"
          placeholder="you@example.com"
          required
        />
      </div>
      <div class="form-group">
        <label for="loginPassword"><i class="fas fa-lock"></i> Password</label>
        <input
          type="password"
          id="loginPassword"
          placeholder="••••••••"
          required
        />
      </div>
      <div id="loginError" class="form-error" style="display: none"></div>
      <button
        class="btn btn-primary btn-block"
        id="loginSubmitBtn"
        data-action="handle-login"
      >
        <span class="btn-text"><i class="fas fa-sign-in-alt"></i> Log In</span>
      </button>
      <p class="auth-switch">
        Don't have an account?
        <a href="#" data-action="switch-auth" data-form="register">Sign Up</a>
      </p>
    </div>

    <!-- Register Form -->
    <div id="registerForm" class="auth-form" style="display: none">
      <h2><i class="fas fa-globe-americas"></i> Join Time To Travel</h2>
      <p class="auth-subtitle">Create your free account</p>
      <div class="form-group">
        <label for="regName"><i class="fas fa-user"></i> Full Name</label>
        <input type="text" id="regName" placeholder="Rahul Sharma" required />
      </div>
      <div class="form-group">
        <label for="regEmail"><i class="fas fa-envelope"></i> Email</label>
        <input
          type="email"
          id="regEmail"
          placeholder="you@example.com"
          required
        />
      </div>
      <div class="form-group">
        <label for="regPassword"
          ><i class="fas fa-lock"></i> Password (min 8, Aa1)</label
        >
        <input
          type="password"
          id="regPassword"
          placeholder="••••••••"
          required
        />
      </div>
      <div id="registerError" class="form-error" style="display: none"></div>
      <button
        class="btn btn-primary btn-block"
        id="registerSubmitBtn"
        data-action="handle-register"
      >
        <span class="btn-text"
          ><i class="fas fa-user-plus"></i> Create Account</span
        >
      </button>
      <p class="auth-switch">
        Already have an account?
        <a href="#" data-action="switch-auth" data-form="login">Log In</a>
      </p>
    </div>
  </div>
</div>
