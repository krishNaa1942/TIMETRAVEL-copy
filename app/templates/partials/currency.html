    <section id="currency" class="section-dark" data-reveal>
      <div class="container">
        <h2 class="section-title light">
          <i class="fas fa-exchange-alt"></i> Currency Converter
        </h2>
        <p class="section-desc light">
          Convert between 14+ currencies with live exchange rates
        </p>
        <div class="currency-card">
          <div class="currency-row">
            <div class="currency-input-group">
              <label>Amount</label>
              <input
                type="number"
                id="currAmount"
                value="1000"
                min="0"
                step="0.01"
              />
            </div>
            <div class="currency-input-group">
              <label>From</label>
              <select id="currFrom">
                <option value="INR" selected>INR (₹)</option>
                <option value="USD">USD ($)</option>
                <option value="EUR">EUR (€)</option>
                <option value="GBP">GBP (£)</option>
                <option value="AUD">AUD (A$)</option>
                <option value="CAD">CAD (C$)</option>
                <option value="SGD">SGD (S$)</option>
                <option value="AED">AED (د.إ)</option>
                <option value="THB">THB (฿)</option>
                <option value="JPY">JPY (¥)</option>
                <option value="MYR">MYR (RM)</option>
                <option value="LKR">LKR (Rs)</option>
                <option value="NPR">NPR (रू)</option>
                <option value="BDT">BDT (৳)</option>
              </select>
            </div>
            <button
              class="currency-swap-btn"
              id="currSwap"
              aria-label="Swap currencies"
            >
              <i class="fas fa-exchange-alt"></i>
            </button>
            <div class="currency-input-group">
              <label>To</label>
              <select id="currTo">
                <option value="INR">INR (₹)</option>
                <option value="USD" selected>USD ($)</option>
                <option value="EUR">EUR (€)</option>
                <option value="GBP">GBP (£)</option>
                <option value="AUD">AUD (A$)</option>
                <option value="CAD">CAD (C$)</option>
                <option value="SGD">SGD (S$)</option>
                <option value="AED">AED (د.إ)</option>
                <option value="THB">THB (฿)</option>
                <option value="JPY">JPY (¥)</option>
                <option value="MYR">MYR (RM)</option>
                <option value="LKR">LKR (Rs)</option>
                <option value="NPR">NPR (रू)</option>
                <option value="BDT">BDT (৳)</option>
              </select>
            </div>
          </div>
          <div class="currency-result" id="currResult">
            <div class="currency-converted">
              <span class="currency-big" id="currConverted">—</span>
              <span class="currency-rate" id="currRateInfo"></span>
            </div>
          </div>
        </div>
      </div>
    </section>
