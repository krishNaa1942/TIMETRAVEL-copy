<!-- ═══════════════════════════════════════════════ LOADER ═══ -->
<div class="loader-overlay" id="loader" style="display: none">
  <div class="loader-spinner"></div>
</div>

<!-- Enhanced loader with message (for async operations) -->
<div class="loader-enhanced" id="loaderEnhanced">
  <div class="loader-enhanced-spinner"></div>
  <div class="loader-enhanced-text" id="loaderEnhancedText">Loading...</div>
</div>

<!-- Custom cursor glow -->
<div class="cursor-glow" id="cursorGlow"></div>

<!-- Tooltip element (shared) -->
<div class="tooltip" id="globalTooltip"></div>

<!-- Toast container for notifications -->
<div id="toast-container" class="toast-container"></div>
