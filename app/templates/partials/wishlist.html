<!-- ═══════════════════════════════════════ WISHLIST ═══ -->
<section id="wishlist" class="section-light">
  <div class="container">
    <h2 class="section-title"><i class="fas fa-heart"></i> My Wishlist</h2>
    <p class="section-desc">Your bookmarked destinations and places</p>
    <div class="wishlist-filters">
      <button class="wl-filter active" data-type="all">All</button>
      <button class="wl-filter" data-type="destination">
        <i class="fas fa-map-marker-alt"></i> Destinations
      </button>
      <button class="wl-filter" data-type="place">
        <i class="fas fa-landmark"></i> Places
      </button>
    </div>
    <div id="wishlistGrid" class="wishlist-grid">
      <div class="empty-state" id="wishlistEmpty">
        <i class="fas fa-heart"></i>
        <p>
          No favorites yet. Click the <i class="fas fa-heart"></i> on any
          destination to bookmark it!
        </p>
      </div>
    </div>
  </div>
</section>
